name: Release dress indexes

on:
  workflow_dispatch:
    inputs:
      native_tag:
        description: 已验证的 nt_helper_release 明确 tag
        required: true
      resource_tag:
        description: 独立资源 tag（留空使用 dress-源码短 SHA）
        required: false
      preflight_only:
        description: 只下载和验证，不发布
        type: boolean
        default: true
      min_weq_version:
        description: 已验证的最低兼容 WeQ 版本（接口未变时保持原基线）
        required: true
        default: '2.7.0'

permissions:
  contents: read

jobs:
  release:
    concurrency:
      group: dress-release-feed
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Checkout shared release tools
        uses: actions/checkout@v6
        with:
          repository: weq-devs/WeQ
          ref: dev
          path: .tools/WeQ
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - run: pnpm --dir .tools/WeQ install --filter @weq/network --frozen-lockfile --ignore-scripts
      - name: Verify metadata signer before publishing
        if: ${{ !inputs.preflight_only }}
        env:
          WEQ_RELEASE_SIGNING_KEY: ${{ secrets.WEQ_RELEASE_SIGNING_KEY }}
        run: node .tools/WeQ/scripts/publish-release-feed.mjs --check-key
      - run: node --test test/*.test.mjs
      - name: Fetch fixed native resources
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_TAG: ${{ inputs.native_tag }}
        run: |
          set -euo pipefail
          [[ "$NATIVE_TAG" =~ ^nt-helper-[a-zA-Z0-9._-]+$ ]] || exit 1
          gh release download "$NATIVE_TAG" --repo weq-devs/nt_helper_release \
            --pattern manifest.json --pattern 'dress-*.dat' --dir .cache/native
      - name: Verify and stage indexes
        id: stage
        env:
          RESOURCE_TAG: ${{ inputs.resource_tag }}
          MIN_WEQ_VERSION: ${{ inputs.min_weq_version }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$RESOURCE_TAG" ]; then args+=(--tag "$RESOURCE_TAG"); fi
          node scripts/stage-release.mjs --native-manifest .cache/native/manifest.json \
            --assets .cache/native --output dist --min-weq-version "$MIN_WEQ_VERSION" "${args[@]}"
          node -e 'const fs=require("fs"); const m=JSON.parse(fs.readFileSync("dist/index-manifest.json")); fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=${m.tag}\n`);'
      - name: Publish verified resources
        if: ${{ !inputs.preflight_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.stage.outputs.tag }}
        run: |
          set -euo pipefail
          # create 拒绝已有版本；不覆盖公开资产，也不删除已发布版本。
          gh release create "$TAG" --draft --target "$GITHUB_SHA" \
            --title "WeQ 装扮索引 $TAG" \
            --notes '独立分发的气泡、字体和头像挂件离线索引。兼容来源及文件摘要见 index-manifest.json。'
          gh release upload "$TAG" dist/index-manifest.json dist/enhancement-pack.json dist/SHA256SUMS \
            dist/dress-bubble.dat dist/dress-font.dat dist/dress-widget.dat
          gh release edit "$TAG" --draft=false --latest
      - name: Publish signed update index
        if: ${{ !inputs.preflight_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.stage.outputs.tag }}
          WEQ_RELEASE_SIGNING_KEY: ${{ secrets.WEQ_RELEASE_SIGNING_KEY }}
        run: node .tools/WeQ/scripts/publish-release-feed.mjs
